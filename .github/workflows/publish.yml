name: publish
on:
  push:
    branches:
      - master
  # The web installer serves firmware copied from the FormationFlight releases
  # at build time (scripts/fetch_firmware.py). The firmware repo sends a
  # repository_dispatch ("firmware") after each release, so the site picks up
  # new firmware right away; the daily run is only a backstop in case one is
  # missed.
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [firmware]
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest push
        uses: actions/checkout@v4

      - name: Setup Python env
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Caching
        uses: actions/cache@v4
        with:
          key: ${{ github.ref }}
          path: .cache

      - name: Setup Github
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git pull
          git checkout master

      - name: Install Dependencies
        run: make install-python-packages

      # Pinned: MkDocs 2.0 does not work with mkdocs-material. 9.7.3 is what
      # the site last built with.
      - name: Install MkDocs
        run: pip install --upgrade "mkdocs-material==9.7.3" "mkdocs<2"

      - name: Fetch firmware for the web installer
        run: python scripts/fetch_firmware.py --out docs/installer/firmware

      # --no-history: the site now carries firmware images, and keeping every
      # deploy's copy of them in gh-pages would grow the repo without bound.
      - name: Deploy release version
        run: |
          mkdocs gh-deploy --force --no-history --config-file mkdocs.yml
          
      - name: Push changes to server
        run: |
          git checkout gh-pages
          git remote set-url --push origin https://actions:$GITHUB_TOKEN@github.com/FormationFlight/Docs
          git push -f origin gh-pages
